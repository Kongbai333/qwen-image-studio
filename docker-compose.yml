services:
  qwen-image-studio:
    image: ghcr.io/kongbai333/qwen-image-studio:sha-d0e206f
    ports:
      - "${QWEN_PORT:-7860}:7860"
    environment:
      QWEN_DATA_DIR: /data
      QWEN_HF_TOKENS: "${QWEN_HF_TOKENS:-}"
      QWEN_PROXIES: "${QWEN_PROXIES:-}"
      QWEN_SPACES: "${QWEN_SPACES:-}"
      QWEN_STRATEGY: "${QWEN_STRATEGY:-token_first}"
      QWEN_CONCURRENCY: "${QWEN_CONCURRENCY:-1}"
    volumes:
      - qwen-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/login', timeout=4).read(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  qwen-data:
