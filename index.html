<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>图像工坊 · Qwen Studio</title>
<link rel="stylesheet" href="/static/theme.css" />
<style>
  .app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- 配额胶囊 ---------- */
  .quota {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 14px 7px 11px;
    border-radius: 999px;
    background: var(--accent-soft);
    border: 1px solid var(--accent-line);
    font-size: 12.8px;
  }
  .quota b { font-size: 14.5px; font-variant-numeric: tabular-nums; }
  .quota.low { background: var(--warn-soft); border-color: #f0dcb6; }
  .quota.none { background: var(--err-soft); border-color: #f0c8c8; }

  /* ---------- 主布局 ---------- */
  .layout {
    display: grid;
    grid-template-columns: 372px 1fr;
    gap: 18px;
    padding: 20px 26px 40px;
    max-width: 1500px;
    width: 100%;
    margin: 0 auto;
    align-items: start;
  }
  .panel-left { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 76px; }

  /* ---------- 参考图 ---------- */
  .drop {
    position: relative;
    display: grid;
    place-items: center;
    gap: 5px;
    padding: 22px 14px;
    border: 1.5px dashed var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    color: var(--muted);
    font-size: 12.5px;
    cursor: pointer;
    transition: 0.15s;
    text-align: center;
    min-height: 92px;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  .drop img { max-height: 148px; max-width: 100%; border-radius: 9px; display: block; }
  .drop .hint { font-size: 11px; color: var(--dim); }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .thumb {
    position: relative;
    width: 78px; height: 78px;
    border-radius: var(--radius-xs);
    overflow: hidden;
    border: 1px solid var(--border-strong);
    background: var(--surface);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .idx {
    position: absolute; left: 4px; top: 4px;
    min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 8px;
    background: rgba(22, 24, 29, 0.72); color: #fff;
    font-size: 10px; line-height: 16px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .thumb .del {
    position: absolute; right: 3px; top: 3px;
    width: 18px; height: 18px; padding: 0;
    border: 0; border-radius: 50%;
    background: rgba(22, 24, 29, 0.72); color: #fff;
    font-size: 12px; line-height: 18px; cursor: pointer;
  }
  .thumb .del:hover { background: var(--err); }

  /* ---------- 结果区 ---------- */
  .stage {
    position: relative;
    min-height: 430px;
    display: grid;
    place-items: center;
    padding: 22px;
    overflow: hidden;
  }
  .stage img.result {
    max-width: 100%;
    max-height: 620px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    display: block;
    cursor: zoom-in;
  }
  .stage .placeholder { text-align: center; color: var(--dim); }
  .ph-title { font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .ph-sub { font-size: 12.5px; }

  .prog {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 13px;
    width: min(320px, 100%);
    text-align: center;
  }
  .prog.on { display: flex; }
  .prog .bar { width: 100%; }
  .prog .st { font-size: 13px; color: var(--muted); }

  .result-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    padding: 13px 18px;
    border-top: 1px solid var(--border);
  }

  /* ---------- 历史条 ---------- */
  .hist {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 13px 16px;
  }
  .hist-item {
    width: 62px;
    height: 62px;
    flex: none;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface-2) center/cover no-repeat;
    cursor: pointer;
    transition: 0.14s;
  }
  .hist-item:hover { border-color: var(--accent); transform: translateY(-2px); }
  .hist-item.on { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(76, 201, 240, 0.25); }

  /* ---------- 画廊 ---------- */
  .gal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 11px; }
  .gal-card {
    border-radius: var(--radius-sm);
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    transition: 0.15s;
  }
  .gal-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .gal-thumb { aspect-ratio: 1; background: var(--surface-2) center/cover no-repeat; }
  .gal-cap { padding: 8px 9px; font-size: 11.4px; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .lightbox {
    position: fixed; inset: 0; z-index: 100;
    display: none; place-items: center;
    background: rgba(23, 32, 51, 0.88);
    backdrop-filter: blur(6px);
    padding: 30px;
  }
  .lightbox.on { display: grid; }
  .lightbox img { max-width: 100%; max-height: 82vh; border-radius: 12px; }
  .lightbox .lb-bar {
    position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 9px; flex-wrap: wrap; justify-content: center;
  }

  /* ---------- 素材库 ---------- */
  .material-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
  .material-item {
    min-width: 0;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: var(--surface-2);
  }
  .material-item img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .material-info { padding: 7px 8px 4px; min-width: 0; }
  .material-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; }
  .material-meta { color: var(--dim); font-size: 10.5px; margin-top: 2px; }
  .material-actions { display: flex; gap: 5px; padding: 4px 7px 7px; }
  .material-actions .btn { flex: 1; min-width: 0; padding-left: 5px; padding-right: 5px; }
  .materials-empty { grid-column: 1 / -1; padding: 16px 8px; text-align: center; color: var(--dim); font-size: 12px; }

  /* ---------- 素材选择弹窗 ---------- */
  .material-picker {
    position: fixed;
    inset: 0;
    z-index: 90;
    display: none;
    place-items: center;
    padding: 20px;
    background: rgba(23, 32, 51, 0.46);
  }
  .material-picker.on { display: grid; }
  .material-picker-dialog {
    width: min(820px, 100%);
    max-height: min(720px, 90vh);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow-pop);
  }
  .material-picker-head { display: flex; align-items: center; gap: 10px; padding: 15px 18px; border-bottom: 1px solid var(--border); }
  .material-picker-head h2 { font-size: 14px; }
  .material-picker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 11px; overflow: auto; padding: 16px; }
  .picker-item { position: relative; overflow: hidden; border: 2px solid transparent; border-radius: var(--radius-sm); background: var(--surface-2); cursor: pointer; }
  .picker-item:hover { border-color: var(--accent-line); }
  .picker-item.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .picker-item img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .picker-item .picker-check { position: absolute; left: 7px; top: 7px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: rgba(22, 24, 29, 0.72); color: #fff; font-size: 11px; line-height: 22px; text-align: center; }
  .picker-item:not(.selected) .picker-check { opacity: 0; }
  .picker-item .material-info { background: var(--surface); }
  .material-picker-foot { display: flex; align-items: center; gap: 9px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .material-picker-foot .grow { flex: 1; }

  .tabbar {
    display: flex;
    gap: 4px;
    width: min(1500px, 100%);
    margin: 0 auto;
    padding: 14px 26px 0;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    padding: 9px 16px;
    border: 0;
    border-bottom: 2px solid transparent;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab-panel { display: none; }
  .tab-panel.on { display: block; }
  .resource-wrap { width: min(1500px, 100%); margin: 0 auto; padding: 20px 26px 40px; }
  .resource-wrap .material-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .resource-wrap .materials-empty { min-height: 120px; display: grid; place-items: center; }

  @media (max-width: 1080px) {
    .layout { grid-template-columns: 1fr; padding: 14px; }
    .panel-left { position: static; }
    .tabbar { padding-left: 14px; padding-right: 14px; }
    .resource-wrap { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- ================= 顶栏 ================= -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">Q</div>
      <div class="brand-text">
        <b>Qwen Studio</b>
        <span>Image 2.1 · GGUF</span>
      </div>
    </div>

    <div class="grow"></div>

    <div class="quota" id="quota">
      <span class="dot ok" id="quotaDot"></span>
      <span>剩余 <b id="quotaNum">—</b> 次</span>
      <span class="dim" id="quotaExp"></span>
    </div>

    <button class="icon-btn hidden" id="btnConsole" title="返回控制台">控制台</button>
    <button class="icon-btn" id="btnGal" title="我的作品">作品</button>
    <button class="icon-btn" id="btnLogout" title="退出登录">退出</button>
  </header>

  <!-- ================= 标签页 ================= -->
  <nav class="tabbar" aria-label="内容导航">
    <button class="tab-btn on" id="tabGenerateBtn" data-tab="generate" type="button">生成</button>
    <button class="tab-btn" id="tabMaterialsBtn" data-tab="materials" type="button">素材库</button>
    <button class="tab-btn" id="tabGalleryBtn" data-tab="gallery" type="button">我的作品</button>
  </nav>

  <div class="tab-panel on" id="tabGenerate">
    <div class="layout">
    <!-- ---------- 左：参数 ---------- -->
    <div class="panel-left">
      <div class="card pad">
        <div class="field" style="margin-bottom:14px">
          <label>模式</label>
          <div class="segs" id="modeSegs"></div>
        </div>

        <div class="field">
          <label for="prompt">提示词</label>
          <textarea id="prompt" placeholder="描述你想生成的画面，或要做的修改…"></textarea>
          <div class="tiny dim" style="text-align:right" id="counter">0 / 4000</div>
        </div>

        <div class="field hidden" id="refWrap" style="margin-top:12px">
          <label>参考图 <span class="dim mono" id="refCount"></span></label>
          <div class="drop" id="drop">
            <div id="dropText">点击 / 拖拽 / 粘贴图片<span class="hint">可多选，最多 10 张 · PNG · JPG · WEBP，每张 ≤10MB</span></div>
          </div>
          <div class="row" style="margin-top:8px">
            <button class="btn ghost sm" id="btnChooseMaterials" type="button">从素材库选择</button>
            <span class="tiny dim">可与新上传图片混用</span>
          </div>
          <div class="thumbs" id="thumbs"></div>
          <div class="tiny dim" style="margin-top:6px">顺序即 prompt 里的「图1 / 图2…」，按编号引用</div>
          <input type="file" id="file" accept="image/*" multiple class="hidden" />
        </div>

        <div class="field" style="margin-top:14px">
          <label for="aspect">画幅</label>
          <select id="aspect"></select>
        </div>

        <div class="field" style="margin-top:14px">
          <label>步数 <span class="accent" id="stepsVal">40</span></label>
          <input type="range" id="steps" min="4" max="40" value="40" />
        </div>

        <div class="field" style="margin-top:12px">
          <label class="checkline">
            <input type="checkbox" id="randSeed" checked /> 随机种子
          </label>
          <input type="number" id="seed" class="mono" value="42" style="margin-top:8px" />
        </div>

        <div class="row" style="margin-top:16px">
          <button class="btn block" id="go">生成</button>
          <button class="btn ghost" id="cancel" disabled style="width:auto">停止</button>
        </div>
      </div>

      <div class="card tight">
        <div class="tiny dim" style="margin-bottom:7px">试试这些</div>
        <div class="row wrap-row" id="examples"></div>
      </div>
    </div>

    <!-- ---------- 右：结果 ---------- -->
    <div class="stack">
      <div class="card">
        <div class="card-head">
          <h2 id="stageTitle">结果</h2>
          <div class="grow"></div>
          <button class="btn ghost sm hidden" id="btnDownload">下载 PNG</button>
          <button class="btn ghost sm hidden" id="btnReuse">复用参数</button>
        </div>

        <div class="stage" id="stage">
          <div class="placeholder" id="placeholder">
            <div class="ph-title">还没有结果</div>
            <div class="ph-sub">输入提示词，点「生成」</div>
          </div>

          <div class="prog" id="prog">
            <div class="bar"><i id="progBar"></i></div>
            <div class="st" id="progText">准备中…</div>
            <button class="btn ghost sm" id="btnStop">取消</button>
          </div>

          <img class="result hidden" id="resultImg" alt="生成结果" />
        </div>

        <div class="result-meta" id="resultMeta"></div>
        <div class="hist hidden" id="histBar"></div>
      </div>

      </div>
    </div>
  </div>

  <div class="tab-panel" id="tabMaterials">
    <div class="resource-wrap">
      <div class="card" id="materialsCard">
        <div class="card-head">
          <h2>我的素材</h2>
          <div class="grow"></div>
          <button class="btn ghost sm" id="btnMaterialUpload" type="button">上传素材</button>
          <input type="file" id="materialFile" accept="image/*" multiple class="hidden" />
          <button class="btn ghost sm" id="btnMaterialsRefresh">刷新</button>
        </div>
        <div class="card-body">
          <div class="material-grid" id="materialGrid"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="tab-panel" id="tabGallery">
    <div class="resource-wrap">
      <div class="card" id="galCard">
        <div class="card-head">
          <h2>我的作品</h2>
          <div class="grow"></div>
          <button class="btn ghost sm" id="btnGalRefresh">刷新</button>
        </div>
        <div class="card-body">
          <div class="gal-grid" id="galGrid"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="material-picker" id="materialPicker" role="dialog" aria-modal="true" aria-labelledby="materialPickerTitle">
    <div class="material-picker-dialog">
      <div class="material-picker-head">
        <h2 id="materialPickerTitle">选择素材</h2>
        <div class="grow"></div>
        <span class="tiny dim" id="materialPickerCount">已选 0 张</span>
      </div>
      <div class="material-picker-grid" id="materialPickerGrid"></div>
      <div class="material-picker-foot">
        <span class="tiny dim">可多选，确认后按选择顺序加入参考图</span>
        <div class="grow"></div>
        <button class="btn ghost sm" id="materialPickerCancel" type="button">取消</button>
        <button class="btn sm" id="materialPickerConfirm" type="button">确认使用</button>
      </div>
    </div>
  </div>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox">
  <img id="lbImg" alt="" />
  <div class="lb-bar">
    <button class="btn ghost sm" id="lbClose">关闭</button>
    <button class="btn ghost sm" id="lbCopy">复制提示词</button>
    <button class="btn sm" id="lbReuse">复用参数</button>
  </div>
</div>

<div class="toast-host" id="toasts"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const S = {
  cfg: null, me: null, mode: "Create an image", references: [], materials: [], pickerSelection: [],
  jobId: null, timer: null, busy: false, lastResult: null, history: [],
};

const MODE_CN = {
  "Create an image": "文生图",
  "Edit an image": "编辑图像",
  "Transparent PNG": "透明底",
};
const SHAPE_CN = {
  Square: "方形", Landscape: "横向", Portrait: "纵向",
};

function shapeLabel(key) {
  const parts = String(key).split(" \u00b7 ");
  if (parts.length !== 2) return key;
  return (SHAPE_CN[parts[0]] || parts[0]) + " " + parts[1];
}

/* ---------- 基础 ---------- */
async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (r.status === 401) { location.href = "/login"; throw new Error("未登录"); }
  const txt = await r.text();
  let data = null;
  try { data = txt ? JSON.parse(txt) : null; } catch { data = { detail: txt }; }
  if (!r.ok) throw new Error((data && data.detail) || `HTTP ${r.status}`);
  return data;
}
const post = (p, body) => api(p, {
  method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body ?? {}),
});

function toast(msg, bad) {
  const el = document.createElement("div");
  el.className = "toast " + (bad ? "err" : "ok");
  el.textContent = msg;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), 3600);
}
const fail = (e) => toast(e.message || String(e), true);

/* ---------- 配额 ---------- */
async function loadMe() {
  try {
    const me = await api("/api/auth/me");
    S.me = me;
    if (!me.authenticated) { location.href = "/login"; return; }
    if (me.role === "admin") {
      $("quotaNum").textContent = "∞";
      $("quota").className = "quota";
      $("quotaDot").className = "dot ok";
      $("quotaExp").textContent = "管理员 · 不限次数";
      $("btnConsole").classList.remove("hidden");
      return;
    }
    const left = me.remaining;
    $("quotaNum").textContent = left === null ? "∞" : left;
    $("quotaDot").className = "dot " + (left === null ? "ok" : left === 0 ? "err" : left <= 3 ? "warn" : "ok");
    $("quota").className = "quota" + (left === null ? "" : left === 0 ? " none" : left <= 3 ? " low" : "");
    $("quotaExp").textContent = me.expires
      ? "· " + new Date(me.expires).toLocaleDateString("zh-CN") + " 到期"
      : "· 永久";
    if (me.usable === false) {
      toast("卡密" + (me.status_cn || "已失效"), true);
      $("go").disabled = true;
    }
  } catch { /* 忽略 */ }
}

function switchTab(name) {
  const tabs = { generate: "tabGenerate", materials: "tabMaterials", gallery: "tabGallery" };
  const target = tabs[name] || tabs.generate;
  Object.entries(tabs).forEach(([key, id]) => {
    const panel = $(id);
    const button = $(`tab${key[0].toUpperCase()}${key.slice(1)}Btn`);
    if (panel) panel.classList.toggle("on", id === target);
    if (button) button.classList.toggle("on", id === target);
  });
  if (name === "materials") loadMaterials();
  if (name === "gallery") loadGallery();
}

/* ---------- 初始化 ---------- */
async function boot() {
  S.cfg = await api("/api/config");
  const c = S.cfg;

  $("modeSegs").innerHTML = c.modes
    .map((m) => `<button data-mode="${esc(m)}">${esc(MODE_CN[m] || m)}</button>`).join("");
  $("modeSegs").querySelectorAll("button").forEach((b) => {
    b.onclick = () => setMode(b.dataset.mode);
  });
  setMode(c.defaults.mode);

  $("aspect").innerHTML = Object.entries(c.sizes)
    .map(([k, [w, h]]) => `<option value="${esc(k)}">${esc(shapeLabel(k))} · ${w}×${h}</option>`).join("");
  $("aspect").value = c.defaults.aspect_ratio;

  $("steps").min = c.steps_min;
  $("steps").max = c.steps_max;
  $("steps").value = c.defaults.steps;
  $("stepsVal").textContent = c.defaults.steps;
  $("steps").oninput = () => ($("stepsVal").textContent = $("steps").value);

  $("seed").max = c.max_seed;
  $("seed").value = c.defaults.seed;
  $("randSeed").onchange = () => ($("seed").disabled = $("randSeed").checked);

  $("examples").innerHTML = c.examples
    .map((e, i) => `<button class="btn ghost sm" data-ex="${i}">${esc(e.label)}</button>`).join("");
  $("examples").querySelectorAll("button").forEach((b) => {
    b.onclick = () => {
      const e = c.examples[+b.dataset.ex];
      $("prompt").value = e.prompt;
      setMode(e.mode);
      onPrompt();
    };
  });

  $("prompt").oninput = onPrompt;

  // 参考图
  $("drop").onclick = () => $("file").click();
  $("file").onchange = (e) => { uploadRefs(e.target.files); e.target.value = ""; };
  ["dragenter", "dragover"].forEach((ev) => $("drop").addEventListener(ev, (e) => {
    e.preventDefault(); $("drop").classList.add("over");
  }));
  ["dragleave", "drop"].forEach((ev) => $("drop").addEventListener(ev, (e) => {
    e.preventDefault(); $("drop").classList.remove("over");
  }));
  $("drop").addEventListener("drop", (e) => uploadRefs(e.dataTransfer.files));
  document.addEventListener("paste", (e) => {
    if (S.mode !== "Edit an image") return;
    const files = [];
    for (const it of e.clipboardData.items) {
      if (it.type.startsWith("image/")) files.push(it.getAsFile());
    }
    if (files.length) uploadRefs(files);
  });

  $("go").onclick = generate;
  $("cancel").onclick = cancelJob;
  $("btnStop").onclick = cancelJob;
  $("btnDownload").onclick = downloadResult;
  $("btnReuse").onclick = () => reuse(S.lastResult);
  $("resultImg").onclick = () => S.lastResult && openLightbox(S.lastResult);
  $("btnGalRefresh").onclick = loadGallery;
  $("btnMaterialsRefresh").onclick = loadMaterials;
  $("btnMaterialUpload").onclick = () => $("materialFile").click();
  $("materialFile").onchange = (e) => { uploadMaterials(e.target.files); e.target.value = ""; };
  document.querySelectorAll("[data-tab]").forEach((button) => {
    button.onclick = () => switchTab(button.dataset.tab);
  });
  $("btnChooseMaterials").onclick = openMaterialPicker;
  $("materialPickerCancel").onclick = closeMaterialPicker;
  $("materialPickerConfirm").onclick = confirmMaterialPicker;
  $("materialPicker").onclick = (e) => { if (e.target.id === "materialPicker") closeMaterialPicker(); };
  $("btnGal").onclick = () => switchTab("gallery");
  $("btnConsole").onclick = () => (location.href = "/admin");
  $("btnLogout").onclick = async () => {
    try { await post("/api/auth/logout"); } catch { /* 忽略 */ }
    location.href = "/login";
  };
  $("lbClose").onclick = closeLightbox;
  $("lightbox").onclick = (e) => { if (e.target.id === "lightbox") closeLightbox(); };
  $("lbCopy").onclick = () => S.lastResult && copyText(S.lastResult.prompt);
  $("lbReuse").onclick = () => { reuse(S.lastResult); closeLightbox(); };
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    closeLightbox();
    closeMaterialPicker();
  });

  await Promise.all([loadMe(), loadGallery(), loadMaterials()]);
  onPrompt();
  await restoreActiveJob();
}

/* ---------- 恢复上次的任务 ---------- */
/* 页面刷新、切到控制台再回来、关掉浏览器重进，都靠 /api/job/active 把状态接回来。
   任务本身在后端跑，前端只是个观察者 —— 所以离开页面不会丢任务。 */
async function restoreActiveJob() {
  try {
    const r = await api("/api/job/active");
    const j = r.job;
    if (!j) return;

    if (j.status === "running" || j.status === "queued") {
      S.jobId = j.id;
      setBusy(true);
      showProgress(0.35, "恢复进行中的任务…");
      poll();
      toast("已接上上次未完成的任务");
      return;
    }
    if (j.status === "done" && j.result) {
      S.jobId = j.id;
      showResult(j);
      return;
    }
    if (j.status === "error" || j.status === "interrupted") {
      toast(j.status === "interrupted"
        ? "上次任务因服务重启中断，请重新生成"
        : "上次任务失败：" + (j.error || "").slice(0, 60), true);
    }
  } catch { /* 忽略：拿不到就当没有 */ }
}

/* 切回标签页时立刻对一次状态，不等下一个轮询周期 */
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && S.jobId && S.busy) {
    clearInterval(S.timer);
    poll();
  }
});

function setMode(m) {
  S.mode = m;
  $("modeSegs").querySelectorAll("button").forEach((b) =>
    b.classList.toggle("on", b.dataset.mode === m));
  $("refWrap").classList.toggle("hidden", m !== "Edit an image");
}

function onPrompt() {
  const n = $("prompt").value.length;
  const c = $("counter");
  c.textContent = `${n} / ${S.cfg?.prompt_max ?? 4000}`;
  c.className = "tiny " + (n > (S.cfg?.prompt_max ?? 4000) ? "err" : "dim");
  c.style.textAlign = "right";
}

/* ---------- 参考图上传 ---------- */
/* 模型原生支持最多 10 张（Qwen-Image-2.1 模型卡），上传顺序就是 prompt 里的
   「图1 / 图2…」。后端按 Space 能力决定整批传还是本地拼图。 */
const MAX_REFS = 10;                      /* 兜底值，实际以 /api/config 的 max_refs 为准 */
const REF_MAX_BYTES = 10 * 1024 * 1024;

function maxRefs() {
  return Number(S.cfg?.max_refs) || MAX_REFS;
}

async function uploadRefs(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  const room = maxRefs() - S.references.length;
  if (room <= 0) return toast(`最多 ${maxRefs()} 张参考图`, true);
  if (files.length > room) toast(`只收前 ${room} 张，上限 ${maxRefs()} 张`, true);

  for (const file of files.slice(0, room)) {
    if (!file.type.startsWith("image/")) { toast(`${file.name} 不是图片`, true); continue; }
    if (file.size > REF_MAX_BYTES) { toast(`${file.name} 超过 10MB`, true); continue; }
    const fd = new FormData();
    fd.append("file", file);
    try {
      const r = await api("/api/upload", { method: "POST", body: fd });
      S.references.push({ path: r.path, url: r.url, name: r.name, material_id: r.material_id });
      renderThumbs();
      await loadMaterials();
    } catch (e) { fail(e); }
  }
  if (S.references.length) toast(`参考图 ${S.references.length} / ${maxRefs()}`);
}

function removeRef(i) {
  S.references.splice(i, 1);
  renderThumbs();
}

function renderThumbs() {
  const box = $("thumbs");
  if (!box) return;
  box.innerHTML = S.references.map((r, i) => `
    <div class="thumb">
      <img src="${esc(r.url)}" alt="参考图 ${i + 1}" />
      <span class="idx">${i + 1}</span>
      <button class="del" type="button" data-i="${i}" title="移除">×</button>
    </div>`).join("");
  box.querySelectorAll(".del").forEach((b) => {
    b.onclick = (e) => { e.stopPropagation(); removeRef(parseInt(b.dataset.i, 10)); };
  });
  $("refCount").textContent = S.references.length
    ? `${S.references.length} / ${maxRefs()}` : "";
}

async function loadMaterials() {
  try {
    const r = await api("/api/materials");
    S.materials = r.items || [];
    renderMaterials();
    if ($("materialPicker")?.classList.contains("on")) renderMaterialPicker();
  } catch (e) {
    if ($("materialGrid")) $("materialGrid").innerHTML = `<div class="materials-empty">素材库加载失败</div>`;
  }
}

async function uploadMaterials(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  let added = 0;
  for (const file of files) {
    if (!file.type.startsWith("image/")) { toast(`${file.name} 不是图片`, true); continue; }
    if (file.size > REF_MAX_BYTES) { toast(`${file.name} 超过 10MB`, true); continue; }
    const fd = new FormData();
    fd.append("file", file);
    try {
      await api("/api/upload", { method: "POST", body: fd });
      added += 1;
    } catch (e) { fail(e); }
  }
  if (added) {
    await loadMaterials();
    toast(`已上传 ${added} 张素材`);
  }
}

function openMaterialPicker() {
  S.pickerSelection = S.references.filter((ref) => ref.material_id).map((ref) => ref.material_id);
  renderMaterialPicker();
  $("materialPicker").classList.add("on");
  document.body.style.overflow = "hidden";
}

function closeMaterialPicker() {
  $("materialPicker").classList.remove("on");
  document.body.style.overflow = "";
}

function renderMaterialPicker() {
  const box = $("materialPickerGrid");
  if (!box) return;
  const order = new Map(S.pickerSelection.map((id, index) => [id, index + 1]));
  $("materialPickerCount").textContent = `已选 ${S.pickerSelection.length} 张`;
  if (!S.materials.length) {
    box.innerHTML = `<div class="materials-empty">还没有上传素材</div>`;
    return;
  }
  box.innerHTML = S.materials.map((m) => {
    const selected = order.has(m.id);
    return `
      <div class="picker-item${selected ? " selected" : ""}" data-picker-id="${esc(m.id)}">
        <img src="${esc(m.image_url)}" alt="${esc(m.name)}" loading="lazy" />
        <span class="picker-check">${selected ? order.get(m.id) : ""}</span>
        <div class="material-info">
          <div class="material-name" title="${esc(m.name)}">${esc(m.name)}</div>
        </div>
      </div>`;
  }).join("");
  box.querySelectorAll("[data-picker-id]").forEach((item) => {
    item.onclick = () => toggleMaterialPicker(item.dataset.pickerId);
  });
}

function toggleMaterialPicker(materialId) {
  const index = S.pickerSelection.indexOf(materialId);
  if (index >= 0) {
    S.pickerSelection.splice(index, 1);
  } else {
    const currentUploads = S.references.filter((ref) => !ref.material_id).length;
    if (currentUploads + S.pickerSelection.length >= maxRefs()) {
      return toast(`最多 ${maxRefs()} 张参考图`, true);
    }
    S.pickerSelection.push(materialId);
  }
  renderMaterialPicker();
}

function confirmMaterialPicker() {
  const selected = new Set(S.pickerSelection);
  const kept = S.references.filter((ref) => !ref.material_id || selected.has(ref.material_id));
  const existing = new Set(kept.filter((ref) => ref.material_id).map((ref) => ref.material_id));
  for (const materialId of S.pickerSelection) {
    if (existing.has(materialId)) continue;
    const material = S.materials.find((item) => item.id === materialId);
    if (material) {
      kept.push({ material_id: material.id, url: material.image_url, name: material.name });
    }
  }
  S.references = kept;
  if (S.references.length) setMode("Edit an image");
  renderThumbs();
  closeMaterialPicker();
}

function materialDate(value) {
  if (!value) return "";
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? "" : d.toLocaleDateString("zh-CN");
}

function renderMaterials() {
  const box = $("materialGrid");
  if (!box) return;
  if (!S.materials.length) {
    box.innerHTML = `<div class="materials-empty">还没有上传素材</div>`;
    return;
  }
  box.innerHTML = S.materials.map((m, i) => `
    <div class="material-item" data-material="${esc(m.id)}">
      <img src="${esc(m.image_url)}" alt="${esc(m.name)}" loading="lazy" />
      <div class="material-info">
        <div class="material-name" title="${esc(m.name)}">${esc(m.name)}</div>
        <div class="material-meta">${esc(materialDate(m.created))}</div>
      </div>
      <div class="material-actions">
        <button class="btn ghost sm" type="button" data-material-add="${i}">加入</button>
        <button class="btn danger sm" type="button" data-material-delete="${i}">删除</button>
      </div>
    </div>`).join("");
  box.querySelectorAll("[data-material-add]").forEach((button) => {
    button.onclick = () => addMaterialRef(S.materials[+button.dataset.materialAdd]);
  });
  box.querySelectorAll("[data-material-delete]").forEach((button) => {
    button.onclick = () => deleteMaterial(S.materials[+button.dataset.materialDelete]);
  });
}

function addMaterialRef(material) {
  if (!material) return;
  if (S.references.some((ref) => ref.material_id === material.id)) {
    return toast("这张素材已经在参考图里", true);
  }
  if (S.references.length >= maxRefs()) return toast(`最多 ${maxRefs()} 张参考图`, true);
  switchTab("generate");
  setMode("Edit an image");
  S.references.push({
    material_id: material.id,
    url: material.image_url,
    name: material.name,
  });
  renderThumbs();
  toast("素材已加入参考图");
}

async function deleteMaterial(material) {
  if (!material) return;
  if (!window.confirm(`删除素材「${material.name}」？`)) return;
  try {
    await api(`/api/materials/${encodeURIComponent(material.id)}`, { method: "DELETE" });
    S.references = S.references.filter((ref) => ref.material_id !== material.id);
    renderThumbs();
    await loadMaterials();
    toast("素材已删除");
  } catch (e) { fail(e); }
}

/* ---------- 生成 ---------- */
function setBusy(b) {
  S.busy = b;
  $("go").disabled = b;
  $("cancel").disabled = !b;
  $("go").innerHTML = b ? '<span class="spin"></span> 生成中' : "生成";
}

async function generate() {
  if (S.busy) return;
  const prompt = $("prompt").value.trim();
  if (!prompt) return toast("先写点提示词", true);
  if (S.mode === "Edit an image" && !S.references.length) return toast("编辑模式要先传参考图", true);

  setBusy(true);
  showProgress(0, "提交中…");
  try {
    const r = await post("/api/generate", {
      prompt,
      mode: S.mode,
      references: S.references.map((r) => r.path).filter(Boolean),
      material_ids: S.references.map((r) => r.material_id).filter(Boolean),
      aspect_ratio: $("aspect").value,
      steps: parseInt($("steps").value, 10),
      seed: parseInt($("seed").value, 10) || 42,
      randomize_seed: $("randSeed").checked,
    });
    S.jobId = r.job_id;
    if (typeof r.remaining === "number") {
      $("quotaNum").textContent = r.remaining;
    }
    poll();
  } catch (e) {
    fail(e);
    setBusy(false);
    hideProgress();
    loadMe();
  }
}

function poll() {
  clearInterval(S.timer);
  S.timer = setInterval(async () => {
    if (!S.jobId) return;
    try {
      const j = await api("/api/job/" + S.jobId);
      const p = j.progress || {};
      const st = p.state || j.status;
      const map = {
        queued: "排队中", starting: "准备中", in_queue: "排队中",
        processing: "生成中", progress: "生成中", running: "生成中",
      };
      let text = map[st] || st;
      if (p.rank !== undefined && p.rank !== null) text += ` · 队列第 ${p.rank} 位`;
      if (p.elapsed) text += ` · ${p.elapsed}s`;
      showProgress(p.progress || 0.35, text);

      if (j.status === "done") {
        clearInterval(S.timer);
        setBusy(false);
        hideProgress();
        showResult(j);
        loadMe();
        loadGallery();
      } else if (j.status === "error" || j.status === "cancelled") {
        clearInterval(S.timer);
        setBusy(false);
        hideProgress();
        toast(j.error || (j.status === "cancelled" ? "已取消" : "生成失败"), true);
        loadMe();
      }
    } catch (e) {
      clearInterval(S.timer);
      setBusy(false);
      hideProgress();
      fail(e);
    }
  }, 700);
}

async function cancelJob() {
  if (!S.jobId) return;
  try { await post(`/api/job/${S.jobId}/cancel`); toast("已请求取消"); }
  catch (e) { fail(e); }
}

function showProgress(ratio, text) {
  $("placeholder").classList.add("hidden");
  $("resultImg").classList.add("hidden");
  $("prog").classList.add("on");
  $("progBar").style.width = Math.round(Math.min(1, ratio) * 100) + "%";
  $("progText").textContent = text;
}
function hideProgress() {
  $("prog").classList.remove("on");
  if (!S.lastResult) $("placeholder").classList.remove("hidden");
}

function showResult(j) {
  const r = j.result;
  if (!r) return;
  S.lastResult = { ...r, prompt: j.params.prompt, mode: j.params.mode,
    aspect_ratio: j.params.aspect_ratio, steps: j.params.steps, seed: r.seed };
  $("resultImg").src = r.image_url + "?t=" + Date.now();
  $("resultImg").classList.remove("hidden");
  $("placeholder").classList.add("hidden");
  $("stageTitle").textContent = "结果";
  $("btnDownload").classList.remove("hidden");
  $("btnReuse").classList.remove("hidden");

  $("resultMeta").innerHTML = [
    ["模式", MODE_CN[j.params.mode] || j.params.mode],
    ["画幅", shapeLabel(j.params.aspect_ratio)],
    ["尺寸", `${r.width}×${r.height}`],
    ["步数", j.params.steps],
    ["种子", r.seed],
    ["耗时", r.elapsed + "s"],
  ].map(([k, v]) => `<span class="tag">${esc(k)} <b class="accent">${esc(v)}</b></span>`).join("");

  S.history.unshift({ url: r.image_url, prompt: j.params.prompt });
  S.history = S.history.slice(0, 12);
  renderHistory();
}

function renderHistory() {
  const bar = $("histBar");
  bar.classList.toggle("hidden", S.history.length === 0);
  bar.innerHTML = S.history.map((h, i) =>
    `<div class="hist-item" data-h="${i}" style="background-image:url('${esc(h.url)}')" title="${esc(h.prompt)}"></div>`
  ).join("");
  bar.querySelectorAll("[data-h]").forEach((el) => {
    el.onclick = () => {
      $("resultImg").src = S.history[+el.dataset.h].url;
      $("resultImg").classList.remove("hidden");
      $("placeholder").classList.add("hidden");
    };
  });
}

function downloadResult() {
  if (!S.lastResult) return;
  const a = document.createElement("a");
  a.href = S.lastResult.image_url + "?download=1";
  a.download = S.lastResult.download_name || "qwen.png";
  a.click();
}

function reuse(x) {
  if (!x) return;
  $("prompt").value = x.prompt || "";
  setMode(x.mode || "Create an image");
  if (x.aspect_ratio) $("aspect").value = x.aspect_ratio;
  if (x.steps) { $("steps").value = x.steps; $("stepsVal").textContent = x.steps; }
  if (x.seed !== undefined && x.seed !== null) {
    $("randSeed").checked = false;
    $("seed").disabled = false;
    $("seed").value = x.seed;
  }
  onPrompt();
  window.scrollTo({ top: 0, behavior: "smooth" });
  toast("参数已填回左侧");
}

/* ---------- 画廊 ---------- */
let galItems = [];
async function loadGallery() {
  try {
    const r = await api("/api/gallery?limit=60");
    galItems = r.items;
    $("galGrid").innerHTML = galItems.length ? galItems.map((x, i) => `
      <div class="gal-card" data-g="${i}">
        <div class="gal-thumb" style="background-image:url('${esc(x.image_url)}')"></div>
        <div class="gal-cap">${esc(x.prompt || "（无提示词）")}</div>
      </div>`).join("")
      : `<div class="empty" style="grid-column:1/-1"><b>还没有作品</b>生成第一张吧</div>`;
    $("galGrid").querySelectorAll("[data-g]").forEach((c) =>
      (c.onclick = () => openLightbox(galItems[+c.dataset.g])));
  } catch (e) { /* 静默 */ }
}

function openLightbox(x) {
  if (!x) return;
  S.lastResult = { ...x, prompt: x.prompt, mode: x.mode,
    aspect_ratio: x.aspect_ratio, steps: x.steps, seed: x.seed };
  $("lbImg").src = x.image_url;
  $("lightbox").classList.add("on");
}
function closeLightbox() { $("lightbox").classList.remove("on"); }

function copyText(t) {
  navigator.clipboard?.writeText(t || "").then(() => toast("已复制"), () => toast("复制失败", true));
}

boot().catch((e) => toast("初始化失败：" + e.message, true));
</script>
</body>
</html>
